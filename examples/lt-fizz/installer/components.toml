[[component]]
id       = "game"
name     = "Game program"
required = true
files    = [{ from = "dist/{target}/FIZZ*", to = "{install}/" }]
shortcut = [{ name = "Lieutenant Fizz", target = "{install}/FIZZ.EXE", in = "start_menu" }]

[[component]]
id      = "sound"
name    = "Sound drivers"
targets = ["dos-x86", "win16-x86"]
files   = [{ from = "dist/sound/*.DRV", to = "{install}/SOUND/" }]

[[component]]
id    = "levels"
name  = "Episode one levels"
files = [{ from = "dist/levels/*", to = "{install}/LEVELS/" }]

# Optional and unticked: the person ticks it on the components page.
[[component]]
id      = "bonus"
name    = "Bonus levels"
default = false
files   = [{ from = "dist/bonus/*", to = "{install}/BONUS/" }]

# Optional and unticked, and it owns no files: ticking it makes Fizz the owner of `.fzs`, and the uninstall gives the extension back to whatever had it.
[[component]]
id      = "savegames"
name    = "Open saved games (.FZS) with Fizz"
default = false
targets = ["win16-x86", "windows-x86"]
file_types = [{ extension = ".fzs", name = "Lt. Fizz saved game", open_with = "{install}/FIZZ.EXE" }]

# Optional and unticked: a screen saver goes in the Windows folder, where Display Properties lists it. A file of the same name already there is kept in the install folder's BACKUP and put back on uninstall.
[[component]]
id      = "screensaver"
name    = "Screen saver"
default = false
targets = ["win16-x86", "windows-x86"]
files   = [{ from = "dist/screensaver/FIZZ.SCR", to = "{windows}/" }]
