# >>> liminst import tauri (generated; the next import replaces this block)
[[component]]
id       = "tauri-app"
name     = "Plume Notes"
required = true
origin   = "tauri"
targets  = ["linux-x86_64", "macos-aarch64"]
files = [
	{ from = "dist/{target}/plume-notes", to = "{install}/" },
	{ from = "dist/{target}/assets/*", to = "{install}/assets/" },
	{ from = "dist/{target}/licences/NOTICE.txt", to = "{install}/licences/NOTICE.txt" },
	{ from = "dist/{target}/plume-sync", to = "{install}/" },
]
shortcut = [
	{ name = "Plume Notes", target = "{install}/plume-notes", in = "start_menu" },
]
file_types = [
	{ extension = ".plume", name = "Plume note", open_with = "{install}/plume-notes" },
]
url_schemes = ["plume"]

[[component]]
id       = "tauri-app-windows"
name     = "Plume Notes"
required = true
origin   = "tauri"
targets  = ["windows-x86_64"]
files = [
	{ from = "dist/{target}/plume-notes.exe", to = "{install}/" },
	{ from = "dist/{target}/assets/*", to = "{install}/assets/" },
	{ from = "dist/{target}/licences/NOTICE.txt", to = "{install}/licences/NOTICE.txt" },
	{ from = "dist/{target}/plume-sync.exe", to = "{install}/" },
]
shortcut = [
	{ name = "Plume Notes", target = "{install}/plume-notes.exe", in = "start_menu" },
	{ name = "Plume Notes", target = "{install}/plume-notes.exe", in = "desktop" },
]
file_types = [
	{ extension = ".plume", name = "Plume note", open_with = "{install}/plume-notes.exe" },
]
url_schemes = ["plume"]
# <<< liminst import tauri
