[[component]]
id       = "app"
name     = "Neutral Sample"
required = true
files    = [{ from = "dist/{target}/neutral*", to = "{install}/" }]
shortcut = [{ name = "Neutral Sample", target = "{install}/neutral", in = "start_menu" }]

[[component]]
id    = "examples"
name  = "Example files"
files = [{ from = "dist/examples/*.txt", to = "{install}/examples/" }]
