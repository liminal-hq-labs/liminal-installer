[product]
id        = "hq.liminal.planboard"
name      = "Planboard"
publisher = "Liminal HQ"
version   = { from = "git-tag" }
licence   = "LICENCE.TXT"

[defaults]
scope = "user"
theme = "afterglow"

[[target]]
id       = "linux-x86_64"
renderer = "canvas"
theme    = "afterglow"
outputs  = ["run", "deb", "rpm"]

[[target]]
id       = "linux-x86_64"
renderer = "tui"
theme    = "afterglow"
outputs  = ["run"]

[[target]]
id       = "windows-x86_64"
renderer = "canvas"
theme    = "afterglow"
outputs  = ["setup-exe", "msix"]

[[target]]
id       = "macos-aarch64"
renderer = "web"
theme    = "afterglow"
outputs  = ["web", "app", "pkg"]

[signing]
feed_key = "keys/feed.pub"
