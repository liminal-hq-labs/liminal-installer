[[component]]
id       = "app"
name     = "Planboard"
required = true
files    = [{ from = "dist/{target}/planboard*", to = "{install}/" }]
shortcut = [{ name = "Planboard", target = "{install}/planboard", in = "start_menu" }]
file_types = [{ extension = ".planboard", name = "Planboard board", open_with = "{install}/planboard" }]
url_schemes = ["planboard"]

[[component]]
id    = "cli"
name  = "Command-line tool"
files = [{ from = "dist/{target}/pbcli*", to = "{install}/bin/" }]
path  = ["{install}/bin"]

[[component]]
id    = "docs"
name  = "Documentation"
files = [{ from = "dist/docs/*.md", to = "{install}/docs/" }]
