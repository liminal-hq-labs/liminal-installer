# One job per check, so a pull request's checks list names exactly what passed or failed.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/*.md'

  headers:
    name: Licence headers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check SPDX headers
        run: bash scripts/check-headers.sh

  prettier:
    name: Prettier
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

  i18n:
    name: Messages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the message catalogue
        run: bun run check:i18n

  banner:
    name: Hero banner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install SVG tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils librsvg2-bin fonts-dejavu-core fonts-liberation

      # The runner image ships Google Chrome, which the text-fit pass drives headless.
      - name: Check the banner
        env:
          BANNER_REQUIRE_RENDER: '1'
        run: bash scripts/check-banner.sh

  # Rust: one job per check in the shared ci-rust image, pinned by digest.
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:f12097be8cc22eb5145a46bc9f75b38a67fedd5833add4392e11ce85023e64df
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:f12097be8cc22eb5145a46bc9f75b38a67fedd5833add4392e11ce85023e64df
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: liminal-installer

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The workspace build turns `li-lpk`'s `std` feature on through the CLI; the reader alone must still build as `no_std`.
      - name: Run clippy on the no_std reader
        run: cargo clippy -p li-lpk --no-default-features --locked -- -D warnings

  bindings:
    name: Bindings drift
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:f12097be8cc22eb5145a46bc9f75b38a67fedd5833add4392e11ce85023e64df
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: liminal-installer

      # Deletes the generated TypeScript, regenerates it with ts-rs and fails on any difference.
      - name: Check the generated bindings
        run: bash scripts/check-bindings-drift.sh

  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:f12097be8cc22eb5145a46bc9f75b38a67fedd5833add4392e11ce85023e64df
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: liminal-installer

      - name: Run the tests
        run: cargo nextest run --workspace --locked --profile ci

      # `publish-test-results.yml` reads these after the run, with the permissions a fork's pull request lacks.
      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rust-test-results
          path: target/nextest/ci/junit.xml
          if-no-files-found: error

      - name: Upload the event file
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: event-file
          path: ${{ github.event_path }}

  # The DOS runtime. The host tests of its crates always run. The DOSBox run needs DOSBox Staging and CWSDPMI from dos/tools/fetch-tools.sh;
  # when they cannot be fetched the run is skipped with a warning and the job still passes.
  dos:
    name: DOS runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain and the disk tools the tests use
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rust-src
          sudo apt-get update -qq
          sudo apt-get install -y -qq dosfstools mtools unzip xz-utils

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: liminal-installer-dos

      - name: Test the DOS crates on the host
        run: |
          cargo test --locked -p li-retro -p li-retro-build -p li-package
          cargo test --locked -p li-cli --test dos

      - name: Fetch the DOS tools
        id: tools
        continue-on-error: true
        run: bash dos/tools/fetch-tools.sh

      - name: Format, lints, build and run SETUP.EXE under DOSBox
        run: bash dos/check.sh

      - name: Install and uninstall Lt. Fizz under DOSBox
        if: steps.tools.outcome == 'success'
        run: bash dos/tools/e2e.sh

      - name: Say that the DOSBox run was skipped
        if: steps.tools.outcome != 'success'
        run: echo "::warning::The DOS tools could not be fetched, so the DOSBox run was skipped."

  # The Win32 runtime for Windows 95 and later. The cheap parts: format, lints, the build, the host tests of the Win32 flow and the checks on the
  # executable (no MMX, SSE or CMOV, imports on the ANSI allowlist, subsystem 4.0). The install under Wine is run locally (`make win32`).
  win32:
    name: Win32 runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain and the LLVM tools
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rust-src
          sudo apt-get update -qq
          sudo apt-get install -y -qq lld llvm
          # Ubuntu names the tools with a version; the scripts look for the plain names.
          mkdir -p "$HOME/bin"
          for t in lld-link llvm-objdump; do
            command -v "$t" > /dev/null || ln -s "$(ls /usr/lib/llvm-*/bin/"$t" | tail -1)" "$HOME/bin/$t"
          done
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: liminal-installer-win32

      - name: Test the Win32 flow on the host
        run: |
          cargo test --locked -p li-retro -p li-retro-build
          cargo test --locked -p li-cli --test win32

      - name: Format, lints, build SETUP.EXE and check it
        env:
          WIN32_REQUIRE_TOOLS: '1'
        run: bash win32/check.sh

  # The Windows 3.1 runtime. The host tests (the flow against DOS's, the compiler, the pack, the CLI) and the cheap parts of retro/win16 always
  # run: format, lints, the packer's tests, the build, `file` on the executables and the size report. The Wine install and uninstall is a
  # separate step that may be skipped; Windows 3.11 under DOSBox-X needs a tree the repository cannot carry and is run by hand.
  win16:
    name: Windows 3.1 runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain and the tools the checks use
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rust-src
          sudo apt-get update -qq
          sudo apt-get install -y -qq file python3

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: liminal-installer-win16

      - name: Test the Windows 3.1 crates on the host
        run: |
          cargo test --locked -p li-retro -p li-retro-build
          cargo test --locked -p li-cli --test win16

      - name: Format, lints, packer tests, build, NE check and sizes
        run: bash retro/win16/check.sh

      - name: Install and uninstall the examples under Wine
        id: wine
        continue-on-error: true
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine wine32:i386 xvfb
          bash retro/win16/tools/e2e-wine.sh

      - name: Say that the Wine run was skipped
        if: steps.wine.outcome != 'success'
        run: echo "::warning::The Wine run did not pass or could not be set up, so the install under Wine was not checked."
