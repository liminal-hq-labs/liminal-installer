name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/*.md'

  headers:
    name: Licence headers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check SPDX headers
        run: bash scripts/check-headers.sh

  prettier:
    name: Prettier
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

  i18n:
    name: Messages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the message catalogue
        run: bun run check:i18n

  banner:
    name: Hero banner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install SVG tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils librsvg2-bin fonts-dejavu-core fonts-liberation

      # The runner image ships Google Chrome, which the text-fit pass drives headless.
      - name: Check the banner
        env:
          BANNER_REQUIRE_RENDER: '1'
        run: bash scripts/check-banner.sh

  # Rust: one job per check in the shared ci-rust image, pinned by digest.
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:f12097be8cc22eb5145a46bc9f75b38a67fedd5833add4392e11ce85023e64df
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:f12097be8cc22eb5145a46bc9f75b38a67fedd5833add4392e11ce85023e64df
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: liminal-installer

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  bindings:
    name: Bindings drift
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:f12097be8cc22eb5145a46bc9f75b38a67fedd5833add4392e11ce85023e64df
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: liminal-installer

      # Deletes the generated TypeScript, regenerates it with ts-rs and fails on any difference.
      - name: Check the generated bindings
        run: bash scripts/check-bindings-drift.sh

  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:f12097be8cc22eb5145a46bc9f75b38a67fedd5833add4392e11ce85023e64df
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: liminal-installer

      - name: Run the tests
        run: cargo nextest run --workspace --locked --profile ci

      # `publish-test-results.yml` reads these after the run, with the permissions a fork's pull request lacks.
      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rust-test-results
          path: target/nextest/ci/junit.xml
          if-no-files-found: error

      - name: Upload the event file
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: event-file
          path: ${{ github.event_path }}
