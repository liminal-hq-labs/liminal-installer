name: Studio

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/studio/**'
      - '.github/workflows/studio.yml'
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'apps/studio/**'
      - '.github/workflows/studio.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  WEBKIT_DEPS: libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev libxdo-dev patchelf

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        if: hashFiles('apps/studio/package.json') != ''
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/studio/package.json

      - name: Set up Node.js
        if: hashFiles('apps/studio/package.json') != ''
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/studio/pnpm-lock.yaml

      - name: Install dependencies
        if: hashFiles('apps/studio/package.json') != ''
        working-directory: apps/studio
        run: pnpm install --frozen-lockfile

      - name: Run the typecheck
        if: hashFiles('apps/studio/package.json') != ''
        working-directory: apps/studio
        run: pnpm run typecheck

  vitest:
    name: Vitest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        if: hashFiles('apps/studio/package.json') != ''
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/studio/package.json

      - name: Set up Node.js
        if: hashFiles('apps/studio/package.json') != ''
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/studio/pnpm-lock.yaml

      - name: Install dependencies
        if: hashFiles('apps/studio/package.json') != ''
        working-directory: apps/studio
        run: pnpm install --frozen-lockfile

      - name: Run the tests
        if: hashFiles('apps/studio/package.json') != ''
        working-directory: apps/studio
        run: pnpm exec vitest run

  cargo-check:
    name: Cargo check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install WebKit dependencies
        if: hashFiles('apps/studio/package.json') != ''
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $WEBKIT_DEPS

      - name: Install the pinned Rust toolchain
        if: hashFiles('apps/studio/package.json') != ''
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Rust build output
        if: hashFiles('apps/studio/package.json') != ''
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/studio/src-tauri

      - name: Run cargo check
        if: hashFiles('apps/studio/package.json') != ''
        working-directory: apps/studio/src-tauri
        run: cargo check --all-targets --locked

  clippy:
    name: Studio clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install WebKit dependencies
        if: hashFiles('apps/studio/package.json') != ''
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $WEBKIT_DEPS

      - name: Install the pinned Rust toolchain
        if: hashFiles('apps/studio/package.json') != ''
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Rust build output
        if: hashFiles('apps/studio/package.json') != ''
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/studio/src-tauri

      - name: Run clippy
        if: hashFiles('apps/studio/package.json') != ''
        working-directory: apps/studio/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

  bundle:
    name: Bundle ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [typecheck, vitest, cargo-check, clippy]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install WebKit dependencies
        if: hashFiles('apps/studio/package.json') != '' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $WEBKIT_DEPS

      - name: Install the pinned Rust toolchain
        if: hashFiles('apps/studio/package.json') != ''
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Rust build output
        if: hashFiles('apps/studio/package.json') != ''
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/studio/src-tauri

      - name: Set up pnpm
        if: hashFiles('apps/studio/package.json') != ''
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/studio/package.json

      - name: Set up Node.js
        if: hashFiles('apps/studio/package.json') != ''
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/studio/pnpm-lock.yaml

      - name: Install dependencies
        if: hashFiles('apps/studio/package.json') != ''
        working-directory: apps/studio
        run: pnpm install --frozen-lockfile

      - name: Build the Studio bundles
        if: hashFiles('apps/studio/package.json') != ''
        working-directory: apps/studio
        run: pnpm exec tauri build

      - name: Upload the bundles
        if: hashFiles('apps/studio/package.json') != ''
        uses: actions/upload-artifact@v5
        with:
          name: studio-${{ matrix.os }}
          path: apps/studio/src-tauri/target/release/bundle/
          if-no-files-found: warn
