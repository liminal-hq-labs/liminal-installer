# Publishes the Rust and Studio test results from a finished run as check runs and a pull request comment.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

name: Publish Test Results

# A separate workflow because the `pull_request` token is read-only for forks, and the action needs
# `checks: write`. A `workflow_run` trigger runs with this file's own permissions, from the default
# branch, whoever opened the pull request. It reads the `rust-test-results` artefact (the `Tests` job
# in `ci.yml`), the `js-test-results` artefact (the `Vitest` job in `studio.yml`) and `event-file`.

on:
  workflow_run:
    workflows: [CI, Studio]
    types:
      - completed

permissions: {}

jobs:
  publish-test-results:
    name: Publish test results
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event.workflow_run.conclusion != 'skipped' && github.event.workflow_run.conclusion != 'cancelled'
    permissions:
      checks: write
      pull-requests: write
      actions: read
    steps:
      - name: Download and extract artefacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACTS_URL: ${{ github.event.workflow_run.artifacts_url }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cd artifacts
          gh api "${ARTIFACTS_URL}" -q '.artifacts[] | [.name, .archive_download_url] | @tsv' |
            while IFS=$'\t' read -r name url; do
              gh api "${url}" > "${name}.zip"
              unzip -d "${name}" "${name}.zip"
            done

      - name: Publish Rust test results
        if: hashFiles('artifacts/rust-test-results/**/*.xml') != ''
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Rust tests
          commit: ${{ github.event.workflow_run.head_sha }}
          event_file: artifacts/event-file/event.json
          event_name: ${{ github.event.workflow_run.event }}
          files: artifacts/rust-test-results/**/*.xml

      - name: Publish Studio test results
        if: hashFiles('artifacts/js-test-results/**/*.xml') != ''
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Studio tests
          commit: ${{ github.event.workflow_run.head_sha }}
          event_file: artifacts/event-file/event.json
          event_name: ${{ github.event.workflow_run.event }}
          files: artifacts/js-test-results/**/*.xml
