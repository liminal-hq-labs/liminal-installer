# ts-rs writes the TypeScript for every `#[ts(export)]` type here when its tests run. The
# `@liminal-hq/installer-protocol` package publishes the folder to the Studio UI.
[env]
TS_RS_EXPORT_DIR = { value = "packages/protocol/src/generated", relative = true }
