[package]
name = "liminal-installer-studio"
description = "Liminal Installer Studio: edit flows, layouts and scripts, and preview installers"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/liminal-hq-labs/liminal-installer"
rust-version = "1.90"
publish = false

[lib]
name = "liminal_installer_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
li-model = { path = "../../../crates/li-model" }
li-studio = { path = "../../../crates/li-studio" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Writes the log file and takes the webview's `console` output through `src/services/logger.ts`.
tauri-plugin-log = "2"
# Follows the system colour scheme and reduced-motion setting, so the theme and motion settings can follow the system.
tauri-plugin-system-appearance = "0.1"
# Remembers the size of the main and Preferences windows between runs (see `src/windows.rs`).
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The debug-only bridge that lets the Tauri MCP server drive the running app. `lib.rs` registers it only when
# `debug_assertions` is on, so release builds never activate it. It is left out on Windows, where its `webview2-com`
# can differ from Tauri's.
[target.'cfg(not(windows))'.dependencies]
tauri-plugin-mcp-bridge = "0.13"

[workspace]
