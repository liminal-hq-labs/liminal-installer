[[component]]
id       = "helper"
name     = "Helper"
required = true
files    = [
  { from = "dist/{target}/HELPER", to = "{install}/" },
  { from = "dist/{target}/helper.cfg", to = "{install}/" },
]
shortcut = [
  { name = "Helper", target = "{install}/HELPER", in = "start_menu" },
  { name = "Stop Helper", target = "{install}/HELPER", in = "start_menu", args = "--quit" },
  { name = "Helper at login", target = "{install}/HELPER", in = "startup", args = "--background" },
]
