[package]
name = "li-retro"
description = "The retro runtime core (no_std plus alloc): compiled project format, flow VM, text-mode renderer and installer engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["std"]
# The host build: the `HostPlatform` simulator and tests. The DOS build turns it off.
std = ["serde/std", "postcard/use-std"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
li-lpk = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
