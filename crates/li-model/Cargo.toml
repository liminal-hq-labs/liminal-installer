[package]
name = "li-model"
description = "Serde types for installer projects, flows, themes, plans, receipts and feeds"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
# Generates the TypeScript the Studio UI imports (see `packages/protocol`).
ts-rs = { workspace = true, optional = true }

[features]
ts = ["dep:ts-rs"]
