[package]
name = "li-render-tui"
description = "Terminal renderer for Liminal Installer layouts, with retro and plain styles"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
li-model.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
# Generates the TypeScript for the cell grid (see `packages/protocol`).
ts-rs = { workspace = true, optional = true }

[features]
ts = ["dep:ts-rs"]
