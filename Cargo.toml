[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/liminal-hq-labs/liminal-installer"
rust-version = "1.90"

[workspace.dependencies]
li-model = { path = "crates/li-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
li-pack = { path = "crates/li-pack" }
li-script = { path = "crates/li-script" }
li-engine = { path = "crates/li-engine" }
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
getrandom = "0.3"
time = { version = "0.3", features = ["parsing", "formatting"] }
mlua = { version = "0.11", features = ["lua54", "vendored", "serialize"] }
rustix = { version = "1", features = ["fs"] }
tempfile = "3"
